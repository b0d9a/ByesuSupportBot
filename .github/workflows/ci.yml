name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast lane: build + unit/integration-mocked tests. No database required.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # DB lane: runs migrations against a real Postgres, then the repository
  # integration suite (audit finding H3). These tests are skipped in the fast
  # lane because they require INTEGRATION_TEST_DB_URL.
  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: byesu
          POSTGRES_PASSWORD: byesu
          POSTGRES_DB: byesu_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byesu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://byesu:byesu@127.0.0.1:5432/byesu_support_test
      INTEGRATION_TEST_DB_URL: postgresql://byesu:byesu@127.0.0.1:5432/byesu_support_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Apply all migrations to the real Postgres (verifies migration order/idempotency).
      - run: npm run migrate
      # Repository/schema integration suite is enabled by INTEGRATION_TEST_DB_URL.
      - run: npm test
