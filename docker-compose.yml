services:
  postgres:
    image: postgres:16-alpine
    container_name: byesu-support-postgres
    environment:
      POSTGRES_USER: byesu
      POSTGRES_PASSWORD: byesu
      POSTGRES_DB: byesu_support_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byesu -d byesu_support_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
